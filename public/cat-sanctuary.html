<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF7E9">
<meta name="description" content="一间装满猫窝、猫爬架、玩具与好梦的像素小屋。">
<title>猫咪的秘密基地</title>
<link rel="icon" href="favicon.ico?v=siamese-large" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=siamese-large" sizes="any">
<link rel="stylesheet" href="cc-cat-themes.css">
<link rel="stylesheet" href="cc-cat.css">
<style>
  :root{color-scheme:light;--paper:#FBF7E9;--ink:#4a3a28;--muted:#8a7a68;--line:#c8b8a0;--sage:#8a7a68;--surface:#FEFCF6;--dot:#b4a78a35;--shadow:#6e62451a}
  *{box-sizing:border-box}
  html,body{margin:0;min-width:300px;min-height:100%;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  body{background-color:var(--paper);background-image:radial-gradient(var(--dot) .8px,transparent .8px);background-size:12px 12px;color:var(--ink);transition:background-color .25s,color .25s}
  button,a,select{-webkit-tap-highlight-color:transparent}
  button,select{font:inherit;color:inherit;cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  a{color:inherit;text-underline-offset:4px}
  button:focus-visible,a:focus-visible,.stage:focus-visible{outline:3px solid var(--sage);outline-offset:5px}
  button:focus:not(:focus-visible){outline:none}
  .app{position:relative;z-index:1;min-height:100svh;max-width:1580px;margin:0 auto;display:flex;flex-direction:column;padding:0 clamp(16px,3vw,48px)}
  .header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 0 10px;flex:none}
  .identity{display:flex;align-items:center;gap:14px;min-width:0}
  .cat-mark{width:58px;height:44px;image-rendering:pixelated;flex:none}
  h1{font-size:22px;letter-spacing:2px;margin:0;font-weight:650;line-height:1.5}
  .tagline{margin:4px 0 0;font-size:14px;letter-spacing:1px;color:var(--muted);line-height:1.6}
  .viewer{position:relative;flex:1;min-height:280px;display:flex;align-items:center;justify-content:center;isolation:isolate}
  .stage{position:relative;width:min(100%,calc(100svh - 218px),1050px);aspect-ratio:1;overflow:hidden;touch-action:pan-y;user-select:none}
  .stage.zoomed{touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}
  .scene{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
  .room{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;-webkit-user-drag:none;pointer-events:none}
  .error{display:none;position:absolute;inset:10%;align-items:center;justify-content:center;text-align:center;line-height:1.9;padding:24px;border:2px dashed var(--line);background:var(--surface);color:var(--muted);font-size:15px}
  .stage.failed .error{display:flex}.stage.failed .scene{visibility:hidden}
  .room-cat-world{position:absolute;left:0;top:0;width:1254px;height:1254px;transform-origin:0 0;pointer-events:none;z-index:1;visibility:hidden}
  .room-cat-world.ready{visibility:visible}
  .room-cat-world .cc-container{position:absolute;width:150px;height:117px;bottom:auto;scale:var(--room-cat-scale,.52);transform:none;transform-origin:75px 117px;transition:none;filter:none;pointer-events:auto;cursor:pointer}
  .room-cat-world .cc-container.flip{scale:calc(-1 * var(--room-cat-scale,.52)) var(--room-cat-scale,.52)}
  .room-cat-world .cc-inner,.room-cat-world .cc-sprite{position:relative;width:150px;height:117px}
  /* Align only the opening stretch silhouette with the resting floor. */
  .room-cat-world #roomCat[data-node="scratch"].st-stretch .cc-cat-art{animation:catScratchOpeningFloor 5.8s steps(1,end) infinite paused;animation-delay:calc(-1 * var(--cat-symbol-time,0s))}
  @keyframes catScratchOpeningFloor{0%{transform:translateY(calc(290px / 33))}17.2%,100%{transform:translateY(0)}}
  .room-cat-shadow{position:absolute;width:64px;height:9px;border-radius:50%;background:#4a3a2821;transform:translate(-50%,-40%);pointer-events:none}
  .room-foreground{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2;image-rendering:pixelated}
  .room-foreground image{image-rendering:pixelated}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:700px){.header{flex-wrap:wrap;gap:14px;padding:18px 0 8px}.identity{gap:10px}.cat-mark{width:46px;height:35px}h1{font-size:20px;letter-spacing:1px}.tagline{font-size:13px;letter-spacing:.3px;margin-top:3px}.viewer{min-height:240px}.stage{width:min(100%,calc(100svh - 305px));min-width:240px}}
  @media(max-width:370px){h1{font-size:19px}.tagline{letter-spacing:0}.identity{gap:8px}.cat-mark{width:42px;height:32px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
<link rel="stylesheet" href="cat-sanctuary-themes.css?v=pixel-ui-2">
<link rel="stylesheet" href="cat-sanctuary-particles.css?v=1">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="identity">
      <canvas class="cat-mark" id="catMark" width="58" height="44" aria-hidden="true"></canvas>
      <div><h1>猫咪的秘密基地</h1><p class="tagline">一屋子的喜欢，咪都给你。</p></div>
    </div>
    <div class="header-actions">
      <div class="room-theme-controls" id="roomThemeControls" aria-busy="false">
        <label for="roomThemeSelect">小窝配色</label>
        <div class="room-theme-picker">
          <button class="pixel-arrow-button" id="roomThemePrev" type="button" aria-label="上一个主题"><svg class="pixel-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 1H7v3H4v3H1v2h3v3h3v3h3v-3H7V9H4V7h3V4h3z"/></svg></button>
          <select id="roomThemeSelect" aria-label="小窝和小猫的主题配色"></select>
          <button class="pixel-arrow-button" id="roomThemeNext" type="button" aria-label="下一个主题"><svg class="pixel-arrow next-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 1H7v3H4v3H1v2h3v3h3v3h3v-3H7V9H4V7h3V4h3z"/></svg></button>
        </div>
      </div>
      <output id="roomThemeStatus" class="visually-hidden" role="status" aria-live="polite"></output>
    </div>
  </header>

  <main class="viewer" aria-label="像素猫咪小屋场景">
    <div class="stage" id="stage" tabindex="0" aria-label="场景画布，可使用加减按钮缩放，放大后拖动查看">
      <div class="scene" id="scene">
        <img class="room" id="room" src="assets/cat-sanctuary/room-v3-pixel.png" width="1254" height="1254" draggable="false" alt="一座温暖而丰富的等距像素猫咪小屋，墙上布满阶梯、猫洞、吊床与连桥，地上有木质猫爬架、蘑菇爬架、柔软猫窝、猫抓板、玩具与喂食角。">
        <div class="cc-walk-strip room-cat-world" id="roomCatWorld">
          <div class="room-cat-shadow" id="roomCatShadow" aria-hidden="true"></div>
          <div class="cc-container st-idle" id="roomCat" role="button" tabindex="0" aria-label="点击猫咪播放一个随机动作"><div class="cc-inner"><div class="cc-sprite"></div></div></div>
        </div>
        <svg class="room-foreground" id="roomForeground" viewBox="0 0 1254 1254" aria-hidden="true"></svg>
      </div>
      <div class="error" role="status">小屋图片暂时没能打开。<br>请刷新页面，再来看看咪。</div>
    </div>
  </main>

  <footer class="footer">
    <div class="control-deck">
      <div class="toolbar" aria-label="场景控制">
        <div class="zoom-control" role="group" aria-label="缩放场景">
          <button id="zoomOut" type="button" aria-label="缩小场景" disabled>−</button>
          <button class="reset" id="resetView" type="button" aria-label="恢复全景"><span id="zoomLabel">100%</span></button>
          <button id="zoomIn" type="button" aria-label="放大场景">+</button>
        </div>
        <a class="tool" id="downloadScene" href="assets/cat-sanctuary/room-v3-pixel.png" download="猫咪的秘密基地-像素版.png"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M8 1h2v7h3v2h-2v2H7v-2H5V8h3zM2 12h2v3h10v-3h2v5H2z"/></svg><span>保存图片</span></a>
      </div>
      <div class="cat-location">
        <label for="catLocation">小猫在</label>
        <div class="location-picker">
          <button class="pixel-arrow-button" id="catPrevLocation" type="button" aria-label="切换到上一个猫咪点位"><svg class="pixel-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 1H7v3H4v3H1v2h3v3h3v3h3v-3H7V9H4V7h3V4h3z"/></svg></button>
          <select class="cat-location-current" id="catLocation" aria-label="猫咪当前点位"></select>
          <button class="pixel-arrow-button" id="catNextLocation" type="button" aria-label="切换到下一个猫咪点位"><svg class="pixel-arrow next-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 1H7v3H4v3H1v2h3v3h3v3h3v-3H7V9H4V7h3V4h3z"/></svg></button>
        </div>
      </div>
    </div>
    <div class="cat-activity" aria-label="小猫活动状态">
      <output class="cat-auto-status" id="catAutoStatus">自动闲逛中</output>
    </div>
    <span class="visually-hidden" id="viewStatus" role="status" aria-live="polite"></span>
  </footer>
</div>

<script src="assets/cat-sanctuary/layout.js?v=1ee02bc42417"></script>
<script src="assets/cat-sanctuary/themes/catalog.js?v=1"></script>
<script src="assets/cat-sanctuary/themes/outlines.js?v=1"></script>
<script src="theme-sync.js?v=1"></script>
<script src="cc-cat.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const stage = $('stage'), scene = $('scene'), image = $('room');
  const zoomIn = $('zoomIn'), zoomOut = $('zoomOut'), zoomLabel = $('zoomLabel');
  let zoom = 1, offsetX = 0, offsetY = 0, drag = null;
  const clamp = (value,min,max) => Math.max(min,Math.min(max,value));
  function renderView() {
    const bounds = stage.getBoundingClientRect();
    offsetX = clamp(offsetX,-bounds.width*(zoom-1)/2,bounds.width*(zoom-1)/2);
    offsetY = clamp(offsetY,-bounds.height*(zoom-1)/2,bounds.height*(zoom-1)/2);
    scene.style.transform = `translate(${offsetX}px,${offsetY}px) scale(${zoom})`;
    stage.classList.toggle('zoomed',zoom > 1);
    zoomLabel.textContent = `${Math.round(zoom*100)}%`;
    zoomIn.disabled = zoom >= 3; zoomOut.disabled = zoom <= 1;
  }
  function setZoom(value) {
    zoom = clamp(Math.round(value*100)/100,1,3);
    renderView();
    $('viewStatus').textContent = `场景缩放至 ${Math.round(zoom*100)}%，${zoom>1?'可以拖动查看':'已显示全景'}`;
  }
  zoomIn.addEventListener('click',() => setZoom(zoom+.25));
  zoomOut.addEventListener('click',() => setZoom(zoom-.25));
  $('resetView').addEventListener('click',() => {offsetX=0;offsetY=0;setZoom(1)});
  stage.addEventListener('keydown',event => {
    if(event.target !== stage) return;
    if(event.key==='+'||event.key==='='){event.preventDefault();setZoom(zoom+.25)}
    if(event.key==='-'){event.preventDefault();setZoom(zoom-.25)}
    if(event.key==='0'){offsetX=0;offsetY=0;setZoom(1)}
    if(zoom>1 && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)){
      event.preventDefault();offsetX+=event.key==='ArrowLeft'?35:event.key==='ArrowRight'?-35:0;offsetY+=event.key==='ArrowUp'?35:event.key==='ArrowDown'?-35:0;renderView();
    }
  });
  stage.addEventListener('pointerdown',event => {
    if(zoom<=1||event.button!==0||event.target.closest('button,[role="button"]'))return;
    drag={id:event.pointerId,x:event.clientX,y:event.clientY,ox:offsetX,oy:offsetY};
    stage.setPointerCapture(event.pointerId);stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove',event => {
    if(!drag||drag.id!==event.pointerId)return;
    offsetX=drag.ox+event.clientX-drag.x;offsetY=drag.oy+event.clientY-drag.y;renderView();
  });
  function stopDrag(){drag=null;stage.classList.remove('dragging')}
  stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);stage.addEventListener('lostpointercapture',stopDrag);
  window.addEventListener('resize',renderView);
  function showImageError(){stage.classList.add('failed');$('downloadScene').removeAttribute('download')}
  image.addEventListener('error',showImageError);
  image.addEventListener('load',() => stage.classList.remove('failed'));
  if(image.complete && image.naturalWidth===0)showImageError();
  renderView();
})();
</script>
<script src="cat-sanctuary.js?v=pixel-ui-2"></script>
<script src="cat-sanctuary-themes.js?v=theme-link-1"></script>
<script src="cat-sanctuary-particles.js?v=1"></script>
</body>
</html>
