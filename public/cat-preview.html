<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素小猫 · 主题与动作</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cc-cat-themes.css">
<link rel="stylesheet" href="cc-cat.css">
<link rel="stylesheet" href="cc-cat-symbols.css">
<style>
body.cat-review-page { margin:0; padding:28px 20px 48px; background:var(--t-bg); color:var(--t-text); }
.cat-review { width:min(100%,940px); margin:0 auto; }
.cat-review-header { display:flex; flex-wrap:wrap; gap:16px; align-items:end; justify-content:space-between; }
.cat-review-header h1 { font-size:22px; font-weight:600; line-height:1.4; }
.cat-review-intro { margin:6px 0 0; max-width:36em; font-size:13px; line-height:1.8; color:var(--t-text-light); }
.cat-review-theme-control { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
.cat-review-theme-control label { font-size:13px; color:var(--t-text-light); }
.cat-review select { min-width:150px; max-width:100%; padding:8px 30px 8px 12px; border:1px solid var(--t-border-light); border-radius:6px; background:var(--t-card); color:var(--t-text); font:inherit; }
.cat-review-live { margin-top:18px; }
.cat-review .cat-review-hero-stage { position:relative; height:292px; margin:0; width:100%; overflow:visible; z-index:0; }
.cat-review .cat-review-hero-stage::before,
.cat-review .cat-review-small-stage::before,
.cat-review .cat-review-gallery-stage::before,
.cat-review .cat-review-action-stage::before { display:none; }
.cat-review .cat-review-hero-stage .cc-container { left:calc(50% - 75px); top:30px; bottom:auto; width:150px; height:160px; scale:2; transform-origin:center top; cursor:default; transition:none; }
.cat-review .cat-review-hero-stage .cc-container.flip { scale:-2 2; }
.cat-review-cat-name { text-align:center; font-size:16px; font-weight:600; margin-top:4px; }
.cat-review-description { min-height:22px; margin:7px 0 0; padding:0 12px; text-align:center; font-size:13px; line-height:1.7; color:var(--t-text-light); }
.cat-review-actual { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
.cat-review-actual-label { font-size:12px; color:var(--t-text-light); white-space:nowrap; }
.cat-review .cat-review-small-stage { position:relative; width:110px; height:100px; margin:0; overflow:visible; }
.cat-review .cat-review-small-stage .cc-container { left:calc(50% - 75px); top:20px; bottom:auto; width:150px; height:160px; scale:.4; transform-origin:center top; cursor:default; transition:none; }
.cat-review .cat-review-small-stage .cc-container.flip { scale:-.4 .4; }
.cat-review-states { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:10px; }
.cat-review-states button { min-width:64px; padding:9px 15px; border:1px solid var(--t-border-light); border-radius:6px; background:var(--t-card); color:var(--t-text); font:inherit; font-size:13px; cursor:pointer; }
.cat-review-states button[aria-pressed="true"] { background:var(--t-secondary); border-color:var(--t-accent); }
.cat-review-states button:hover { background:var(--t-secondary); }
.cat-review-actions { margin-top:34px; }
.cat-review-actions summary { width:fit-content; color:var(--t-text-light); font-size:14px; cursor:pointer; }
.cat-review-action-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:14px; }
.cat-review-action { min-width:0; padding:4px 10px 16px; border:1px solid var(--t-border-light); border-radius:8px; background:var(--t-card); color:var(--t-text); font:inherit; text-align:center; cursor:pointer; }
.cat-review-action[aria-pressed="true"] { border-color:var(--t-accent); box-shadow:inset 0 0 0 1px var(--t-accent); }
.cat-review-action:hover { background:var(--t-secondary); }
.cat-review-action:focus-visible { outline:2px solid var(--t-accent-dark); outline-offset:3px; }
.cat-review .cat-review-action-stage { position:relative; display:block; width:100%; height:132px; margin:0; pointer-events:none; }
.cat-review .cat-review-action-stage .cc-container { left:calc(50% - 75px); top:6px; bottom:auto; width:150px; height:160px; scale:1; transform-origin:center top; transition:none; }
.cat-review-action-label { display:block; font-size:13px; font-weight:600; line-height:1.6; }
.cat-review-action-description { display:block; margin-top:4px; color:var(--t-text-light); font-size:11px; line-height:1.6; }
.cat-review-themes { margin-top:38px; }
.cat-review-themes summary { width:fit-content; padding:4px 0; color:var(--t-text-light); font-size:14px; cursor:pointer; }
.cat-review-themes[open] summary { margin-bottom:14px; }
.cat-review-gallery { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:12px; }
.cat-review-theme { display:flex; flex-direction:column; align-items:stretch; min-width:0; padding:10px 6px 12px; border:1px solid var(--t-border-light); border-radius:8px; background:var(--t-card); color:var(--t-text); font:inherit; cursor:pointer; text-align:center; }
.cat-review-theme[aria-pressed="true"] { outline:2px solid var(--t-accent); outline-offset:2px; }
.cat-review-theme:focus-visible,.cat-review-states button:focus-visible,.cat-review select:focus-visible { outline:2px solid var(--t-accent-dark); outline-offset:3px; }
.cat-review .cat-review-gallery-stage { position:relative; display:block; width:100%; height:86px; margin:0; pointer-events:none; }
.cat-review .cat-review-gallery-stage .cc-container { left:calc(50% - 75px); top:4px; bottom:auto; width:150px; height:160px; scale:.5; transform-origin:center top; cursor:inherit; transition:none; }
.cat-review .cat-review-gallery-stage :is(.cc-inner,.cc-sprite) { display:block; }
.cat-review .cat-review-gallery-stage * { animation:none !important; }
.cat-review-theme[data-theme="gold"] { --t-card:#fefcf6; --t-text:#4a3a28; --t-text-light:#8a7a68; --t-border-light:#c8b8a0; --t-accent:#8a7a68; }
.cat-review-theme-label { display:block; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
.cat-review-theme-cat { display:block; margin-top:2px; font-size:11px; line-height:1.5; color:var(--t-text-light); overflow-wrap:anywhere; }
.cat-review-live-status { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
@media (max-width:900px) {
  .cat-review .cat-review-small-stage .cc-container { scale:.3; }
  .cat-review .cat-review-small-stage .cc-container.flip { scale:-.3 .3; }
}
@media (max-width:720px) { .cat-review-action-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:480px) {
  body.cat-review-page { padding:20px 14px 36px; }
  .cat-review-header { align-items:start; gap:12px; }
  .cat-review-header h1 { font-size:20px; }
  .cat-review-theme-control { width:100%; }
  .cat-review select { flex:1; min-width:0; }
  .cat-review .cat-review-hero-stage { height:266px; }
  .cat-review .cat-review-hero-stage .cc-container { top:30px; scale:1.8; }
  .cat-review .cat-review-hero-stage .cc-container.flip { scale:-1.8 1.8; }
  .cat-review-states { gap:6px; }
  .cat-review-states button { flex:0 0 calc(25% - 5px); min-width:0; padding:10px 4px; white-space:nowrap; }
  .cat-review-gallery { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
}
@media (pointer:coarse) { .cat-review-states button,.cat-review select { min-height:44px; } }
</style>
</head>
<body class="cat-review-page">
<main class="cat-review" id="catReview">
  <header class="cat-review-header">
    <div>
      <h1>像素小猫</h1>
      <p class="cat-review-intro">趴成一小团，收好短短的爪子，尾巴搭在身后。</p>
    </div>
    <div class="cat-review-theme-control">
      <label for="catReviewTheme">主题</label>
      <select id="catReviewTheme">
        <option value="gold">焦糖布丁</option><option value="cozy">慵懒晨光</option>
        <option value="macaron">柔雾马卡龙</option><option value="berry">莓莓粉荔</option>
        <option value="slate">湖光暖岸</option><option value="summer">晴川浅夏</option>
        <option value="candy">糖果马卡龙</option><option value="mintchoc">薄荷生巧</option>
        <option value="gelato">夏日冰淇淋</option><option value="blueberry">蓝莓酸奶</option>
        <option value="spring">柠翠晴日</option><option value="mint">清新薄荷</option>
        <option value="pinkcoast">粉蓝海岸</option><option value="coconut">蕉叶椰乳</option>
        <option value="mintrose">薄荷粉藤</option><option value="milktea">奶茶蓝调</option>
        <option value="greencream">青青奶霜</option><option value="springplaid">春风格纹</option>
        <option value="traingreen">夏枝列车</option><option value="pistachio">青柠马卡龙</option>
        <option value="icecool">清爽冰凉</option><option value="orangesoda">橙汽苏打</option>
        <option value="appleyogurt">苹果酸奶夹</option><option value="mistmacaron">青橙马卡龙</option>
        <option value="custom">自定义</option>
      </select>
    </div>
  </header>

  <section class="cat-review-live" aria-label="小猫动作预览">
    <div class="cc-walk-strip cat-review-hero-stage" id="catReviewHero"></div>
    <div class="cat-review-cat-name" id="catReviewName"></div>
    <p class="cat-review-description" id="catReviewDescription">安静趴坐，眨眨眼，尾巴尖偶尔动一下。</p>
    <div class="cat-review-actual">
      <span class="cat-review-actual-label">实际大小</span>
      <div class="cc-walk-strip cat-review-small-stage" id="catReviewActual"></div>
    </div>
    <div class="cat-review-states" role="group" aria-label="小猫动作">
      <button type="button" data-state="idle" aria-pressed="true">待机</button>
      <button type="button" data-state="walk" aria-pressed="false">走路</button>
      <button type="button" data-state="thinking" aria-pressed="false">思考</button>
      <button type="button" data-state="coding" aria-pressed="false">工作</button>
      <button type="button" data-state="looking" aria-pressed="false">查找</button>
      <button type="button" data-state="sweeping" aria-pressed="false">整理</button>
      <button type="button" data-state="error" aria-pressed="false">遇到问题</button>
      <button type="button" data-state="happy" aria-pressed="false">开心</button>
    </div>
    <span class="cat-review-live-status" id="catReviewStatus" aria-live="polite"></span>
  </section>

  <details class="cat-review-actions" open>
    <summary>同时看看 8 个动作</summary>
    <div class="cat-review-action-grid" id="catReviewActions"></div>
  </details>

  <details class="cat-review-themes">
    <summary>全部主题小猫（24 只）</summary>
    <div class="cat-review-gallery" id="catReviewGallery"></div>
  </details>
</main>

<template id="catReviewSceneTemplate">
  <div class="cc-container st-idle" role="img" aria-label="像素小猫">
    <div class="spk"><svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6" fill="var(--cc-sparkle)"/></svg></div>
    <div class="spk"><svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6" fill="var(--cc-sparkle)"/></svg></div>
    <div class="spk"><svg viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6" fill="var(--cc-sparkle)"/></svg></div>
    <div class="fpx"></div><div class="fpx"></div>
    <div class="blue-px" style="top:8px;left:22px"></div>
    <div class="blue-px" style="top:2px;left:38px"></div>
    <div class="blue-px" style="top:12px;right:10px"></div>
    <div class="blue-px" style="top:4px;right:24px"></div>
    <div class="cc-bubble" aria-hidden="true">
      <div class="cc-bubble-box"><span class="cat-idle-note">…</span></div>
      <span class="bdot bdot1"></span><span class="bdot bdot2"></span>
    </div>
    <div class="cc-think" aria-hidden="true">
      <div class="cc-think-box"><span class="cc-think-txt">…</span></div>
      <span class="bdot bdot1"></span><span class="bdot bdot2"></span>
    </div>
    <div class="cc-laptop" aria-hidden="true">
      <div class="lt-body"><div class="lt-screen"><div class="lt-dot"></div></div></div>
      <div class="lt-base"></div>
    </div>
    <div class="cc-qmark" aria-hidden="true">
      <svg width="28" height="36" viewBox="0 0 7 9">
        <rect x="1" y="0" width="4" height="1" fill="var(--cc-accent)"/><rect x="0" y="1" width="2" height="1" fill="var(--cc-accent)"/>
        <rect x="4" y="1" width="2" height="1" fill="var(--cc-accent)"/><rect x="3" y="2" width="2" height="1" fill="var(--cc-accent)"/>
        <rect x="2" y="3" width="2" height="1" fill="var(--cc-accent)"/><rect x="2" y="5" width="2" height="1" fill="var(--cc-accent)"/>
      </svg>
    </div>
    <div class="cat-status-note" aria-hidden="true">再试一下</div>
    <div class="cc-broom" aria-hidden="true">
      <div class="broom-stick"></div><div class="broom-head"></div><div class="broom-edge"></div>
    </div>
    <div class="cc-inner"><div class="cc-sprite"></div></div>
  </div>
</template>

<script src="cc-cat-symbols.js"></script>
<script src="cc-cat.js"></script>
<script>
(() => {
  const root = document.getElementById('catReview');
  const themeSelect = document.getElementById('catReviewTheme');
  const gallery = document.getElementById('catReviewGallery');
  const name = document.getElementById('catReviewName');
  const status = document.getElementById('catReviewStatus');
  const description = document.getElementById('catReviewDescription');
  const actions = document.getElementById('catReviewActions');
  const template = document.getElementById('catReviewSceneTemplate');
  const stateButtons = [...root.querySelectorAll('.cat-review-states button')];
  const descriptions = {
    idle: '安静趴坐，眨眨眼，尾巴尖偶尔动一下。',
    walk: '两只短短的前爪，轮流伸出、收回，轻轻迈步。',
    thinking: '眨眨眼，动动耳朵，旁边的小像素圈转呀转。',
    coding: '低头专心，小爪子轮流轻点键盘。',
    looking: '探头看看周围，旁边亮起小小的像素放大镜。',
    sweeping: '伸出一只爪子，慢慢把身边整理好。',
    error: '耳朵轻轻一耷，小像素问号冒出来，再试一下。',
    happy: '眯起眼睛，抬抬小爪，像素音符跟着轻轻跳。'
  };
  let selectedState = 'idle';
  const scene = () => template.content.firstElementChild.cloneNode(true);
  const hero = scene();
  const actual = scene();
  document.getElementById('catReviewHero').append(hero);
  document.getElementById('catReviewActual').append(actual);
  const mainCats = [hero, actual];
  mainCats.forEach(cat => window.CCPixelCat.mount(cat));

  stateButtons.forEach(control => {
    const state = control.dataset.state;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'cat-review-action';
    button.dataset.state = state;
    button.setAttribute('aria-pressed', String(state === selectedState));
    button.setAttribute('aria-label', control.textContent + '，' + descriptions[state]);
    const stage = document.createElement('span');
    stage.className = 'cc-walk-strip cat-review-action-stage';
    const cat = scene();
    cat.setAttribute('aria-hidden', 'true');
    cat.removeAttribute('role');
    stage.append(cat);
    const label = document.createElement('span');
    label.className = 'cat-review-action-label';
    label.textContent = control.textContent;
    const caption = document.createElement('span');
    caption.className = 'cat-review-action-description';
    caption.textContent = descriptions[state];
    button.append(stage, label, caption);
    actions.append(button);
    window.CCPixelCat.setState(cat, state);
    button.addEventListener('click', () => { applyState(state); saveState(); });
  });

  function catName(element) {
    return getComputedStyle(element).getPropertyValue('--cat-name').trim().replace(/^["']|["']$/g, '') || '像素小猫';
  }

  [...themeSelect.options].filter(option => option.value !== 'custom').forEach(option => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'cat-review-theme';
    button.dataset.theme = option.value;
    button.setAttribute('aria-pressed', 'false');
    const strip = document.createElement('span');
    strip.className = 'cc-walk-strip cat-review-gallery-stage';
    const cat = document.createElement('span');
    cat.className = 'cc-container st-idle';
    cat.dataset.previewStatic = 'true';
    cat.setAttribute('aria-hidden', 'true');
    const inner = document.createElement('span');
    inner.className = 'cc-inner';
    const sprite = document.createElement('span');
    sprite.className = 'cc-sprite';
    inner.append(sprite);
    cat.append(inner);
    strip.append(cat);
    const label = document.createElement('span');
    label.className = 'cat-review-theme-label';
    label.textContent = option.textContent;
    const catLabel = document.createElement('span');
    catLabel.className = 'cat-review-theme-cat';
    button.append(strip, label, catLabel);
    gallery.append(button);
    window.CCPixelCat.mount(cat);
    catLabel.textContent = catName(cat);
    button.setAttribute('aria-label', option.textContent + '，' + catLabel.textContent);
    button.addEventListener('click', () => {
      themeSelect.value = option.value;
      applyTheme();
      saveState();
    });
  });

  function applyTheme() {
    const theme = themeSelect.value;
    document.documentElement.dataset.theme = theme === 'gold' ? '' : theme;
    gallery.querySelectorAll('.cat-review-theme').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.theme === theme));
    });
    const label = catName(hero);
    name.textContent = label;
    const selected = stateButtons.find(button => button.dataset.state === selectedState);
    hero.setAttribute('aria-label', label + '，' + selected.textContent + '，放大预览');
    actual.setAttribute('aria-label', label + '，' + selected.textContent + '，实际大小');
    status.textContent = themeSelect.selectedOptions[0].textContent + '，' + label + '，' + selected.textContent;
  }

  function applyState(state) {
    selectedState = state;
    mainCats.forEach(cat => window.CCPixelCat.setState(cat, state));
    stateButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.state === state)));
    actions.querySelectorAll('.cat-review-action').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.state === state)));
    const selected = stateButtons.find(button => button.dataset.state === state);
    description.textContent = descriptions[state];
    hero.setAttribute('aria-label', name.textContent + '，' + selected.textContent + '，放大预览');
    actual.setAttribute('aria-label', name.textContent + '，' + selected.textContent + '，实际大小');
    status.textContent = name.textContent + '，' + selected.textContent + '。' + descriptions[state];
  }

  function saveState() {
    window.openai?.setWidgetState?.({
      modelContent: { character: '趴坐像素猫', theme: themeSelect.value, animation: selectedState },
      privateContent: null
    })?.catch(() => {});
  }
  function restore(snapshot) {
    const state = snapshot?.modelContent ?? snapshot ?? {};
    if ([...themeSelect.options].some(option => option.value === state.theme)) themeSelect.value = state.theme;
    applyTheme();
    applyState(stateButtons.some(button => button.dataset.state === state.animation) ? state.animation : 'idle');
  }
  themeSelect.addEventListener('change', () => { applyTheme(); saveState(); });
  stateButtons.forEach(button => button.addEventListener('click', () => { applyState(button.dataset.state); saveState(); }));
  window.addEventListener('openai:set_globals', event => {
    if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
  });
  restore(window.openai?.widgetState);
})();
</script>
</body>
</html>
